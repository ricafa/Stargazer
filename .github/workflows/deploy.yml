name: Deploy no GitHub Pages

on:
  # Publica a cada push na branch principal.
  push:
    branches: [main]
  # Permite rodar manualmente pela aba "Actions" do repositório.
  workflow_dispatch:

# Permissões necessárias para o GitHub Pages publicar o site.
permissions:
  contents: read
  pages: write
  id-token: write

# Se dois pushes acontecerem juntos, deixa apenas o mais recente publicar.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build do Astro
        uses: withastro/action@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
